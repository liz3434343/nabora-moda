<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>NABORA — Otoño 2026</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#f6f1e9;
    color:#191613;
    font-family:Georgia,"Times New Roman",serif;
}

/* ================= NAV ================= */

nav{
    position:sticky;
    top:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 6%;
    background:rgba(246,241,233,.97);
    border-bottom:1px solid #ddd4c8;
}

.logo{
    font-size:25px;
    letter-spacing:7px;
}

nav ul{
    display:flex;
    gap:28px;
    list-style:none;
}

nav a{
    text-decoration:none;
    color:#191613;
    font-family:Arial,sans-serif;
    font-size:11px;
    letter-spacing:1px;
}

.admin-btn{
    background:#191613;
    color:white;
    border:0;
    padding:11px 15px;
    cursor:pointer;
    font-size:10px;
}

/* ================= HERO + CARRUSEL ================= */

.hero{
    position:relative;
    min-height:700px;
    overflow:hidden;
    background:#ddd4c8;
}

.carousel{
    position:absolute;
    inset:0;
}

.slide{
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity .7s ease;
    background:#ded6cc;
}

.slide.active{
    opacity:1;
}

.slide img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.slide-empty{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#777067;
    font-family:Arial,sans-serif;
    font-size:12px;
    letter-spacing:2px;
}

.slide::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.16);
}

.hero-content{
    position:relative;
    z-index:5;
    min-height:700px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:80px 20px;
    color:white;
    text-shadow:0 2px 15px rgba(0,0,0,.35);
}

.hero-small{
    font-family:Arial,sans-serif;
    font-size:11px;
    letter-spacing:5px;
    margin-bottom:25px;
}

.hero h1{
    font-size:clamp(65px,11vw,125px);
    font-weight:normal;
    letter-spacing:14px;
}

.hero h2{
    font-size:22px;
    font-weight:normal;
    letter-spacing:5px;
    margin-top:15px;
}

.hero p{
    max-width:620px;
    margin:30px auto;
    font-family:Arial,sans-serif;
    line-height:1.8;
}

.hero-link{
    display:inline-block;
    background:white;
    color:#191613;
    text-decoration:none;
    padding:16px 32px;
    font-family:Arial,sans-serif;
    font-size:10px;
    letter-spacing:2px;
}

/* CARRUSEL CONTROLES */

.carousel-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    z-index:10;
    width:48px;
    height:48px;
    border:1px solid rgba(255,255,255,.7);
    background:rgba(0,0,0,.25);
    color:white;
    cursor:pointer;
    font-size:22px;
}

.carousel-arrow:hover{
    background:#191613;
}

.prev{
    left:25px;
}

.next{
    right:25px;
}

.dots{
    position:absolute;
    z-index:20;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:9px;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    border:1px solid white;
    background:transparent;
    cursor:pointer;
}

.dot.active{
    background:white;
}

/* BOTONES SUBIR CARRUSEL */

.carousel-upload{
    position:absolute;
    z-index:30;
    bottom:25px;
    left:25px;
}

.carousel-upload label{
    background:white;
    color:#191613;
    padding:12px 16px;
    cursor:pointer;
    font-family:Arial,sans-serif;
    font-size:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.carousel-upload input{
    display:none;
}

/* ================= SECCIONES ================= */

.section{
    padding:100px 7%;
}

.section-title{
    text-align:center;
    font-size:45px;
    font-weight:normal;
}

.section-subtitle{
    text-align:center;
    color:#756d64;
    font-family:Arial,sans-serif;
    font-size:13px;
    margin:15px auto 50px;
}
